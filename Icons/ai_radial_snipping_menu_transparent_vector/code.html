<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 360" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-center-clean" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green-clean" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple-clean" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-amber-clean" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-blue-clean" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Button Gradients -->
    <linearGradient id="centerStarGradClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <!-- Concentric Arc Rings (no solid/dark background circles) -->
  <circle cx="330" cy="180" r="55" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.35" />
  <circle cx="330" cy="180" r="120" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.45" />
  
  <!-- Dotted Connecting Lines -->
  <line x1="330" y1="180" x2="279" y2="71" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="0.8" />
  <line x1="330" y1="180" x2="219" y2="135" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="0.8" />
  <line x1="330" y1="180" x2="219" y2="225" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="0.8" />
  <line x1="330" y1="180" x2="279" y2="289" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="0.8" />
  
  <!-- 1. Text Snip (Top / Green) -->
  <g>
    <rect x="128" y="45" width="120" height="52" rx="14" fill="#09120e" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" />
    <text x="188" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">Text Snip</text>
    <text x="188" y="83" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399" text-anchor="middle">Plain Text OCR</text>
    <circle cx="279" cy="71" r="21" fill="#022c22" stroke="#10b981" stroke-width="2" filter="url(#glow-green-clean)" />
    <text x="279" y="77" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#34d399" text-anchor="middle">T</text>
  </g>
  
  <!-- 2. Equation Snip (Upper Middle / Purple) -->
  <g>
    <rect x="68" y="109" width="120" height="52" rx="14" fill="#13091c" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" />
    <text x="128" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">Equation Snip</text>
    <text x="128" y="147" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c084fc" text-anchor="middle">Equation OCR</text>
    <circle cx="219" cy="135" r="21" fill="#2e1065" stroke="#a855f7" stroke-width="2" filter="url(#glow-purple-clean)" />
    <text x="219" y="140" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="15" fill="#e9d5ff" text-anchor="middle">fx</text>
  </g>
  
  <!-- 3. Code Snip (Lower Middle / Amber) -->
  <g>
    <rect x="58" y="199" width="130" height="52" rx="14" fill="#1c1205" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" />
    <text x="123" y="220" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">Code Snip</text>
    <text x="123" y="237" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24" text-anchor="middle">Syntax Formatted</text>
    <circle cx="219" cy="225" r="21" fill="#451a03" stroke="#f59e0b" stroke-width="2" filter="url(#glow-amber-clean)" />
    <text x="219" y="230" font-family="monospace" font-weight="bold" font-size="15" fill="#fef08a" text-anchor="middle">&lt;/&gt;</text>
  </g>
  
  <!-- 4. Diagram Snip (Bottom / Blue) -->
  <g>
    <rect x="128" y="263" width="120" height="52" rx="14" fill="#08101e" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.2" />
    <text x="188" y="284" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">Diagram Snip</text>
    <text x="188" y="301" font-family="'JetBrains Mono', monospace" font-size="10" fill="#60a5fa" text-anchor="middle">Vector Tracing</text>
    <circle cx="279" cy="289" r="21" fill="#172554" stroke="#3b82f6" stroke-width="2" filter="url(#glow-blue-clean)" />
    <!-- Node Network Icon -->
    <g transform="translate(269, 279)" stroke="#93c5fd" stroke-width="1.8" fill="none">
      <circle cx="10" cy="3" r="2.2" fill="#93c5fd" />
      <circle cx="3" cy="10" r="2.2" fill="#93c5fd" />
      <circle cx="17" cy="16" r="2.2" fill="#93c5fd" />
      <line x1="5" y1="8.5" x2="8.5" y2="4.5" />
      <line x1="5" y1="11.5" x2="15" y2="15" />
    </g>
  </g>
  
  <!-- Central AI Snip Trigger Button with Thunder Icon -->
  <g filter="url(#glow-center-clean)">
    <circle cx="330" cy="180" r="27" fill="url(#centerStarGradClean)" stroke="#38bdf8" stroke-width="2" />
    <circle cx="330" cy="180" r="25" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" />
    <!-- Thunderbolt Icon -->
    <path d="M334 163 L319 181 L329 181 L324 197 L341 177 L331 177 Z" fill="#ffffff" />
  </g>
  <!-- Close Badge (X) -->
  <g>
    <circle cx="352" cy="158" r="9" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <path d="M348.5 154.5 L355.5 161.5 M355.5 154.5 L348.5 161.5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
